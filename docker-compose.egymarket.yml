services:
  app:
    image: ghcr.io/rawrmingos-design/laravel-topup:latest
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${NGINX_PORT:-8088}:8080"
    volumes:
      - ./.env:/var/www/html/.env
      - egymarkettest_app_storage:/var/www/html/storage/app
      - egymarkettest_app_logs:/var/www/html/storage/logs
      - ./nginx-custom.conf:/etc/nginx/conf.d/custom_limits.conf
      - ./php-custom.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ${PUBLIC_PRODUCT_LOGO_PATH:-./client-assets/egymarket/public/assets/product_logo}:/var/www/html/public/assets/product_logo
      - ${PUBLIC_THUMBNAIL_PATH:-./client-assets/egymarket/public/assets/thumbnail}:/var/www/html/public/assets/thumbnail
      - ${PUBLIC_BANNER_PATH:-./client-assets/egymarket/public/assets/banner}:/var/www/html/public/assets/banner
      - ${PUBLIC_BANNER_GAME_PATH:-./client-assets/egymarket/public/assets/banner_game}:/var/www/html/public/assets/banner_game
      - ${PUBLIC_LOGO_PATH:-./client-assets/egymarket/public/assets/logo}:/var/www/html/public/assets/logo
      - ${PUBLIC_MEDIA_PATH:-./client-assets/egymarket/public/assets/media}:/var/www/html/public/assets/media
      - ${PUBLIC_ARTICLE_THUMBNAILS_PATH:-./client-assets/egymarket/public/articles/thumbnails}:/var/www/html/public/articles/thumbnails
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_egymarket_id_test}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - egymarkettest_net

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8089}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - db
    networks:
      - egymarkettest_net

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-db_egymarket_id_test}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - egymarkettest_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - egymarkettest_net

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - egymarkettest_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - egymarkettest_net

volumes:
  egymarkettest_db_data:
  egymarkettest_redis_data:
  egymarkettest_app_storage:
  egymarkettest_app_logs:

networks:
  egymarkettest_net:
    driver: bridge
