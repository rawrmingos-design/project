<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Kamu sedang offline</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 165, 74, .22), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(80, 167, 255, .18), transparent 32%),
                linear-gradient(145deg, #111116 0%, #1f1f29 100%);
        }
        main {
            width: min(100%, 520px);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 28px;
            background: rgba(255, 255, 255, .06);
            box-shadow: 0 28px 80px rgba(0, 0, 0, .35);
            text-align: center;
            backdrop-filter: blur(18px);
        }
        .badge {
            display: inline-flex;
            margin-bottom: 18px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 165, 74, .14);
            color: #ffd7a8;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); line-height: 1.05; }
        p { margin: 16px 0 0; color: rgba(255, 255, 255, .72); line-height: 1.65; }
        a, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 28px;
            padding: 13px 18px;
            border: 0;
            border-radius: 16px;
            color: #111116;
            background: linear-gradient(135deg, #ffd166, #ff8a3d);
            font: inherit;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 16px 32px rgba(255, 138, 61, .22);
            cursor: pointer;
        }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .actions a { background: rgba(255, 255, 255, .1); color: #fff; box-shadow: none; }
    </style>
</head>
<body>
    <main>
        <span class="badge">Offline Mode</span>
        <h1>Kamu sedang offline</h1>
        <p>Cek koneksi internet kamu lalu coba kembali. Transaksi, invoice, dan pembayaran membutuhkan koneksi aktif agar status tetap akurat.</p>
        <div class="actions">
            <button type="button" onclick="window.location.reload()">Coba Lagi</button>
            <a href="/id">Buka Beranda</a>
        </div>
    </main>
</body>
</html>
