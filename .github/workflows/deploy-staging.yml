# =====================================================
# GitHub Actions — CI/CD Laravel Topup Game
# =====================================================
# Trigger : Push ke branch "main" atau "master"
# Pipeline :
#   1. Test  → jalankan PHPUnit / Pest
#   2. Build → build Docker image & push ke GHCR
#   3. Deploy→ SSH ke VPS, pull image, restart container
# =====================================================

name: Deploy to Staging

on:
  push:
    branches:
      - staging


permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  # Nama image Docker (pakai GitHub Container Registry)
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/laravel-topup

jobs:

  # ===================================================
  # JOB 1: Test
  # ===================================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip, intl
          coverage: none

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: 📁 Prepare required directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs
          chmod -R 777 bootstrap/cache storage

      - name: 🔧 Install Composer dependencies
        run: composer install --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: 📝 Copy .env for testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: ⚙️ Configure test environment
        run: |
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env

      - name: 🗃️ Run migrations
        run: php artisan migrate --force

      - name: ✅ Run Tests (Pest)
        run: php artisan test --parallel

  browser-tests:
    name: 🌐 Run Browser Tests
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, bcmath, gd, zip, intl
          coverage: none

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-browser-${{ hashFiles('composer.lock') }}
          restore-keys: composer-browser-

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 📁 Prepare required directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs
          chmod -R 777 bootstrap/cache storage

      - name: 🔧 Install dependencies
        run: |
          composer install --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs
          npm ci

      - name: 🎭 Install Chromium
        run: npx playwright install --with-deps chromium

      - name: ✅ Run deterministic browser tests
        run: npm run test:e2e

      - name: 📎 Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ===================================================
  # JOB 2: Build & Push Docker Image
  # ===================================================
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-24.04
    needs:
      - test
      - browser-tests
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: ⚡ Setup Docker Buildx (cache support)
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Build & Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================================
  # JOB 3: Deploy ke VPS via SSH
  # ===================================================
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-24.04
    needs: build   # Hanya jalan jika build berhasil
    environment: production   # Butuh approval manual (opsional)

    steps:
      - name: 📥 Checkout code (untuk docker-compose.yml)
        uses: actions/checkout@v7

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Sync deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          port: ${{ secrets.STAGING_VPS_PORT || 22 }}
          source: "docker/scripts/deploy-vps.sh,docker/scripts/post-deploy-app.sh"
          target: ${{ secrets.STAGING_VPS_APP_PATH }}
          overwrite: true

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          port: ${{ secrets.STAGING_VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.STAGING_VPS_APP_PATH }}

            if [ -d .git ]; then
              git fetch origin ${{ github.ref_name }} \
                && git checkout ${{ github.ref_name }} \
                && git pull --ff-only origin ${{ github.ref_name }} \
                || echo "Lewati sinkron git di VPS; deploy image tetap dilanjutkan."
            fi

            export IMAGE_NAME="${{ env.IMAGE_NAME }}"
            export IMAGE_TAG="staging"
            export GHCR_USERNAME="${{ github.actor }}"
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"

            sh docker/scripts/deploy-vps.sh

      - name: 📢 Notify deploy success (opsional — Telegram/Discord)
        if: success()
        run: |
          echo "Deploy berhasil ke production 🚀"
          # Uncomment untuk kirim notif ke Telegram:
          # curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          #   -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          #   -d "text=✅ Deploy *${{ github.repository }}* ke production berhasil! Commit: ${{ github.sha }}" \
          #   -d "parse_mode=Markdown"

      - name: 🔴 Notify deploy failure
        if: failure()
        run: |
          echo "Deploy GAGAL! Cek log di GitHub Actions."
          # Uncomment untuk kirim notif ke Telegram:
          # curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          #   -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          #   -d "text=🔴 Deploy *${{ github.repository }}* GAGAL! Cek GitHub Actions." \
          #   -d "parse_mode=Markdown"
