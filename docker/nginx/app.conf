events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Log ke stdout/stderr agar bisa dilihat via docker logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Fallback untuk blok statis di bawah, PER HOST — supaya perilaku host lain tidak
    # ikut berubah:
    #   - host dokumentasi: asetnya sengaja di `resources/docs-api/` (di luar `public/`
    #     agar tidak bisa dilewati gate login), jadi permintaan yang tidak ada di disk
    #     harus sampai ke Laravel.
    #   - host lain: aset yang tidak ada tetap 404 oleh nginx (cepat, seperti sebelumnya).
    #
    # `if ($host ~* ^docs\.) { rewrite ... }` TIDAK dipakai di `location`: itu melempar
    # SEMUA `.css`/`.js` host docs ke Laravel, termasuk aset public/ yang nyata, sehingga
    # halaman sign-in kehilangan CSS-nya dan tampil rusak.
    map $host $static_fallback {
        default       "=404";
        ~*^docs\.     "@laravel";
    }

    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Laravel URL rewriting
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM (lokal, bukan container lain)
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            # Forward X-Forwarded-Proto agar Laravel bisa detect HTTPS di balik reverse proxy
            fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param  HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;
        }

        location ~ /\.ht {
            deny all;
        }

        # Livewire serves this URL dynamically, but it ends with ".js".
        # Keep it out of the generic static-asset location so Laravel can handle it.
        location = /livewire/livewire.js {
            expires 1M;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files /vendor/livewire/livewire.js /index.php?$query_string;
        }

        location ^~ /assets/optimized/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files $uri =404;
        }

        # Cache static assets + CORS for cross-subdomain requests (Filament/admin).
        # Laravel HandleCors middleware is bypassed for files served directly by Nginx.
        #
        # PENGECUALIAN HOST DOCS — kenapa `map` dan bukan `if ($host ~* ^docs\.)`:
        # hasil build dokumentasi disajikan Laravel dari `resources/docs-api/` (di luar
        # `public/` supaya tidak bisa dilewati gate login), jadi aset docs TIDAK ADA di
        # disk dan `try_files $uri =404` akan menjawab 404 sebelum sampai ke Laravel.
        #
        # Tapi jangan melempar SEMUA `.css`/`.js` host docs ke Laravel: host docs juga
        # memuat aset public/ yang nyata (mis. CSS halaman sign-in), dan melemparnya ke
        # gate login membuat CSS-nya hilang — halaman tampil rusak. Jadi hanya permintaan
        # yang TIDAK ADA di disk yang diteruskan, dan itu diatur per host lewat `map`
        # (lihat `$static_fallback` di atas) supaya perilaku host lain tidak berubah.
        location ~* \.(css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1M;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files $uri $uri/ $static_fallback;
        }

        location @laravel {
            rewrite ^ /index.php?$query_string last;
        }
    }
}
