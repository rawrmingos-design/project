events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Log ke stdout/stderr agar bisa dilihat via docker logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Laravel URL rewriting
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM (lokal, bukan container lain)
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            # Forward X-Forwarded-Proto agar Laravel bisa detect HTTPS di balik reverse proxy
            fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param  HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;
        }

        location ~ /\.ht {
            deny all;
        }

        # Livewire serves this URL dynamically, but it ends with ".js".
        # Keep it out of the generic static-asset location so Laravel can handle it.
        location = /livewire/livewire.js {
            expires 1M;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files /vendor/livewire/livewire.js /index.php?$query_string;
        }

        # Cache static assets + CORS for cross-subdomain requests (Filament/admin).
        # Laravel HandleCors middleware is bypassed for files served directly by Nginx.
        location ~* \.(css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1M;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files $uri =404;
        }
    }
}
