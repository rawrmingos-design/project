# =====================================================
# nginx.conf — Konfigurasi Nginx untuk Laravel
# =====================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------
    # Logging
    # -------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------
    # Performance
    # -------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # -------------------------------------------------------
    # Upload / body size (sesuaikan dengan kebutuhan upload)
    # -------------------------------------------------------
    client_max_body_size 20M;

    # -------------------------------------------------------
    # Security Headers (disarankan)
    # -------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    server_tokens off;

    # -------------------------------------------------------
    # Server Block — Laravel Application
    # -------------------------------------------------------
    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # -------------------------------------------------------
        # Laravel Pretty URLs (semua request ke index.php)
        # -------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # -------------------------------------------------------
        # PHP-FPM Passthrough
        # -------------------------------------------------------
        location ~ \.php$ {
            fastcgi_pass   app:9000;   # "app" = nama service PHP di docker-compose
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Header penting saat Docker berada di belakang aaPanel reverse proxy
            # Agar Laravel bisa baca IP asli user & status HTTPS
            fastcgi_param  HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
            fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param  HTTP_X_REAL_IP         $remote_addr;
        }

        # Livewire serves this URL dynamically, but it ends with ".js".
        # Keep it out of the generic static-asset location so Laravel can handle it.
        location = /livewire/livewire.js {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files /vendor/livewire/livewire.js /index.php?$query_string;
        }

        location ^~ /assets/optimized/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files $uri =404;
        }

        # -------------------------------------------------------
        # Static Assets — Cache panjang + CORS lintas subdomain
        # -------------------------------------------------------
        location ~* \.(js|css|mjs|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Vary "Origin" always;
            try_files $uri =404;
        }

        # -------------------------------------------------------
        # Blokir akses ke file sensitif
        # -------------------------------------------------------
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~ ^/(storage|bootstrap|config|database|routes|tests|vendor) {
            deny all;
            return 403;
        }

        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt  { log_not_found off; access_log off; }

        # -------------------------------------------------------
        # Error Pages
        # -------------------------------------------------------
        error_page 404 /index.php;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
