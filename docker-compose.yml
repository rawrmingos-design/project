services:
  app:
    image: ghcr.io/rawrmingos-design/laravel-topup:${IMAGE_TAG:-latest}
    container_name: istana_topup
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${NGINX_PORT:-9000}:8080"
      - "${REVERB_PORT:-9001}:9001"
    volumes:
      - ./.env:/var/www/html/.env
      - istana_app_storage:/var/www/html/storage/app
      - istana_app_logs:/var/www/html/storage/logs
      - ./nginx-custom.conf:/etc/nginx/conf.d/custom_limits.conf
      - ./php-custom.ini:/usr/local/etc/php/conf.d/uploads.ini
      - public_product_logo:/var/www/html/public/assets/product_logo
      - public_thumbnail:/var/www/html/public/assets/thumbnail
      - public_banner:/var/www/html/public/assets/banner
      - public_banner_game:/var/www/html/public/assets/banner_game
      - public_logo:/var/www/html/public/assets/logo
      - public_media:/var/www/html/public/assets/media
      - public_article_thumbnails:/var/www/html/public/articles/thumbnails
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-laravel_topup}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - istana_topup__net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: istana_topup_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-9001}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - db
    networks:
      - istana_topup__net

  db:
    image: mysql:8.0
    container_name: istana_topup__db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_topup}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - istana_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - istana_topup__net

  redis:
    image: redis:7.2-alpine
    container_name: istana_topup__redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - istana_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - istana_topup__net

volumes:
  istana_db_data:
  istana_redis_data:
  istana_app_storage:
  istana_app_logs:
  public_product_logo:
    driver: local
  public_thumbnail:
    driver: local
  public_banner:
    driver: local
  public_banner_game:
    driver: local
  public_logo:
    driver: local
  public_media:
    driver: local
  public_article_thumbnails:
    driver: local

networks:
  istana_topup__net:
    driver: bridge
